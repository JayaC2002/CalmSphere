{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSphere AI Companion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f9f8;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1.5px solid #edf2f0;
            margin-bottom: 16px;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-title h2 {
            color: #2a7a6d;
            font-size: 1.4rem;
            margin: 0;
            font-weight: 700;
        }

        .badge-status {
            background: #e8f5f1;
            color: #2a7a6d;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .dashboard-btn {
            text-decoration: none;
            color: #2a7a6d;
            border: 1.5px solid #2a7a6d;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dashboard-btn:hover {
            background: #2a7a6d;
            color: white;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #cfdeda;
            border-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: #2a7a6d;
            color: white;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.45;
            box-shadow: 0 2px 6px rgba(42, 122, 109, 0.2);
        }

        .bot {
            align-self: flex-start;
            background: #f4f8f7;
            color: #2c3e50;
            border: 1px solid #e2ebe8;
            padding: 14px 18px;
            border-radius: 18px 18px 18px 4px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .bot b.bot-name {
            color: #2a7a6d;
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .bot-text {
            color: #2d3748;
        }

        .bot-text strong, .bot-text b {
            color: #1a202c;
        }

        .message-box {
            display: flex;
            gap: 10px;
            padding-top: 10px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1.5px solid #d9e5e2;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2a7a6d;
            box-shadow: 0 0 0 3px rgba(42, 122, 109, 0.12);
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #2a7a6d;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #22665b;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <div class="chat-title">
                <h2>CalmSphere AI Companion</h2>
                <span class="badge-status">● Active</span>
            </div>
            <a href="{% url 'dashboard' %}" class="dashboard-btn">
                ← Dashboard
            </a>
        </div>

        <div class="messages" id="messages">
            <div class="bot">
                <b class="bot-name">CalmSphere AI</b>
                <div class="bot-text">Hi! I'm your CalmSphere companion. How's your day going? 😊</div>
            </div>
        </div>

        <div class="message-box">
            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                onkeypress="handleKey(event)"
                autofocus
            />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const message = inputField.value.trim();

            if (message === "") return;

            const messages = document.getElementById("messages");

            // Render User Message
            const userDiv = document.createElement("div");
            userDiv.className = "user";
            userDiv.textContent = message;
            messages.appendChild(userDiv);

            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            // Render Bot Message Container
            const botDiv = document.createElement("div");
            botDiv.className = "bot";
            botDiv.innerHTML = `
                <b class="bot-name">CalmSphere AI</b>
                <div class="bot-text">...</div>
            `;
            messages.appendChild(botDiv);

            const botText = botDiv.querySelector(".bot-text");
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                // Handle JSON Response (e.g. Danger keyword override or errors)
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    botText.innerHTML = formatResponse(data.response || data.error || "No response received.");
                    messages.scrollTop = messages.scrollHeight;
                    return;
                }

                // Handle Streaming Response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                botText.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    fullText += chunk;
                    botText.innerHTML = formatResponse(fullText);
                    messages.scrollTop = messages.scrollHeight;
                }

            } catch (error) {
                botText.innerHTML = "Something went wrong while connecting to the assistant. Please try again.";
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        }

        function formatResponse(text) {
            if (!text) return "";
            // Double line breaks
            text = text.replace(/\n\n/g, "<br><br>");
            // Single line breaks
            text = text.replace(/\n/g, "<br>");
            // Bullet points
            text = text.replace(/^- /gm, "• ");
            // Numbered lists
            text = text.replace(/(\d+)\.\s/g, "<br><b>$1.</b> ");
            return text;
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
